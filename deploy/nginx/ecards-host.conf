# E-Cards DEMO — site config for the SERVER's own nginx (this is NOT a container config).
#
# Companion: deploy/nginx/ecards-prd-host.conf serves the PRODUCTION site
# (ecards.aiepic.app → loopback 7500/7600). http-scoped names (upstreams, map
# variable) must stay distinct between the two files or `nginx -t` fails.
#
# The compose stack publishes only on loopback:
#   front-cards  -> 127.0.0.1:${FRONTEND_HOST_PORT}   (default 7300)
#   api-server   -> 127.0.0.1:${API_HOST_PORT}        (default 7400)
# Nothing else is exposed, so this file is the only public entry point.
#
# Install:
#   sudo cp deploy/nginx/ecards-host.conf /etc/nginx/sites-available/ecards-demo.aiepic.app.conf
#   sudo ln -s /etc/nginx/sites-available/ecards-demo.aiepic.app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are issued and renewed on this server by certbot; see
# .work/docs/runbooks/operations-runbook.md § Production cutover (host nginx + TLS).
#
# Routing: Next.js owns /, /_next, /oauth, /auth and /api/auth/* (BFF cookie handlers).
# Fastify owns /health and every other /api/* path, including WebSocket upgrades.

upstream ecards_next {
    server 127.0.0.1:7300;
    keepalive 32;
}

upstream ecards_api {
    server 127.0.0.1:7400;
    keepalive 32;
}

# Only send the Connection: upgrade header when the client actually asked for it.
map $http_upgrade $ecards_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ecards-demo.aiepic.app;

    # certbot --webroot renewals must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` (not the `http2 on;` directive) — this host runs nginx 1.24.0,
    # and the standalone directive only exists from 1.25.1.
    listen 443 ssl http2;
    server_name ecards-demo.aiepic.app;

    ssl_certificate     /etc/letsencrypt/live/ecards-demo.aiepic.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecards-demo.aiepic.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ecards-demo.aiepic.app/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ecards_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batch spreadsheets, font files and design ZIPs.
    client_max_body_size 100M;

    access_log /var/log/nginx/ecards-demo.access.log;
    error_log  /var/log/nginx/ecards-demo.error.log;

    # Uncomment when the hostname is proxied through Cloudflare, so logs and rate
    # limiting see the visitor IP instead of a Cloudflare edge address.
    #include /etc/nginx/snippets/ecards-cloudflare-realip.conf;

    location = /health {
        proxy_pass http://ecards_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/auth/ {
        proxy_pass http://ecards_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://ecards_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecards_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://ecards_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecards_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
