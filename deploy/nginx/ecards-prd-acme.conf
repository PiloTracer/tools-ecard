# Temporary HTTP-only site for ecards.aiepic.app — used ONCE, only to issue the
# origin Let's Encrypt certificate before the real site can be installed
# (the full ecards-prd-host.conf references cert files that don't exist yet, so
# `nginx -t` would fail if installed first).
#
# Usage (see runbook § Production cutover):
#   sudo cp deploy/nginx/ecards-prd-acme.conf /etc/nginx/sites-available/ecards.aiepic.app.conf
#   sudo ln -sf /etc/nginx/sites-available/ecards.aiepic.app.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d ecards.aiepic.app
# Then install the real site over it:
#   sudo cp deploy/nginx/ecards-prd-host.conf /etc/nginx/sites-available/ecards.aiepic.app.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ecards.aiepic.app;

    # certbot --webroot renewals must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Nothing else is served until the real site (with TLS) replaces this file.
    location / {
        return 444;
    }
}
