# E-Cards PRODUCTION — site config for the SERVER's own nginx (NOT a container config).
#
# Companion to deploy/nginx/ecards-host.conf (the DEMO site, ecards-demo.aiepic.app).
# Both sites live on the same host nginx, so every http-scoped name in this file
# (upstreams, map variable, log files) is deliberately suffixed `_prd` — reusing the
# demo file's names would make `nginx -t` fail with duplicate definition errors.
#
# The prd compose stack publishes only on loopback, on its own ports:
#   front-cards  -> 127.0.0.1:${FRONTEND_HOST_PORT}   (.env.prd: 7500)
#   api-server   -> 127.0.0.1:${API_HOST_PORT}        (.env.prd: 7600)
# (The demo stack keeps 7300/7400 — the two never collide.)
#
# Install:
#   sudo cp deploy/nginx/ecards-prd-host.conf /etc/nginx/sites-available/ecards.aiepic.app.conf
#   sudo ln -s /etc/nginx/sites-available/ecards.aiepic.app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates are issued and renewed on this server by certbot; see
# .work/docs/runbooks/operations-runbook.md § Production cutover (host nginx + TLS).
# Don't forget to register https://ecards.aiepic.app/oauth/complete with the IdP.
#
# Routing: Next.js owns /, /_next, /oauth, /auth and /api/auth/* (BFF cookie handlers).
# Fastify owns /health and every other /api/* path, including WebSocket upgrades.

upstream ecards_prd_next {
    server 127.0.0.1:7500;
    keepalive 32;
}

upstream ecards_prd_api {
    server 127.0.0.1:7600;
    keepalive 32;
}

# Only send the Connection: upgrade header when the client actually asked for it.
map $http_upgrade $ecards_prd_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ecards.aiepic.app;

    # certbot --webroot renewals must stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` (not the `http2 on;` directive) — this host runs nginx 1.24.0,
    # and the standalone directive only exists from 1.25.1.
    listen 443 ssl http2;
    server_name ecards.aiepic.app;

    ssl_certificate     /etc/letsencrypt/live/ecards.aiepic.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecards.aiepic.app/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ecards.aiepic.app/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ecards_prd_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Batch spreadsheets, font files and design ZIPs.
    client_max_body_size 100M;

    access_log /var/log/nginx/ecards-prd.access.log;
    error_log  /var/log/nginx/ecards-prd.error.log;

    # Uncomment when the hostname is proxied through Cloudflare, so logs and rate
    # limiting see the visitor IP instead of a Cloudflare edge address.
    #include /etc/nginx/snippets/ecards-cloudflare-realip.conf;

    location = /health {
        proxy_pass http://ecards_prd_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location ^~ /api/auth/ {
        proxy_pass http://ecards_prd_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://ecards_prd_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecards_prd_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://ecards_prd_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecards_prd_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
